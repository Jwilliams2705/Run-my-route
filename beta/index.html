<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14213d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ruta a Medida">
<meta name="description" content="Corre o rueda y conoce la ciudad: rutas con tus kilómetros y tu terreno que pasan por los lugares más interesantes cerca de ti.">
<title>Ruta a Medida</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
:root {
  --bg: #fff6ea; --bg2: #ffe7cc; --ink: #14213d; --muted: #5d6680; --card: #ffffff; --line: #ece3d6;
  --app: #14213d; --sun: #ffc23c; --accent: #ff5a36;
  --plano: #22b573; --ondulado: #2f8cff; --subida: #ff8a1f; --bajada: #e8458b; --ok: #17a35e; --bad: #e23d3d;
  --f-display: "Barlow Condensed", "Arial Narrow", sans-serif; --f-body: "Archivo", system-ui, sans-serif; --f-data: "JetBrains Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) { :root { --bg: #10172a; --bg2: #1b2440; --ink: #f2f4fa; --muted: #a3acc4; --card: #1c2642; --line: #2c3758; --app: #0a1022; color-scheme: dark } }
* { box-sizing: border-box }
html, body { margin: 0; min-height: 100% }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.45 }
button { font: inherit; color: inherit; cursor: pointer }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px }
.top { position: sticky; top: 0; z-index: 900; background: var(--app); color: #fff; padding: calc(10px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 12px max(16px, env(safe-area-inset-left, 0px)); display: flex; justify-content: space-between; align-items: center; gap: 10px }
.top h1 { margin: 0; font-family: var(--f-display); font-size: clamp(21px, 6.2vw, 26px); text-transform: uppercase; line-height: 1; white-space: nowrap }
.top h1 span { color: var(--sun) }
.topbtns { display: flex; gap: 6px }
.icon-btn { border: 0; background: rgba(255,255,255,.12); color: #fff; border-radius: 12px; padding: 8px 10px; font-size: 13px; font-weight: 600; white-space: nowrap }
.banner { margin: 0; padding: 8px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px)); background: var(--sun); color: #14213d; font-size: 13px; font-weight: 600 }
#map { height: 44vh; min-height: 280px; background: var(--line) }
body.running #map { height: calc(100vh - 290px); height: calc(100dvh - 290px) }
.gps { margin: -22px max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); position: relative; z-index: 500; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 10px 12px; box-shadow: 0 8px 20px -10px rgba(20,33,61,.4); font-size: 13px; display: grid; gap: 8px }
body.running .gps { display: none }
.gpsrow { display: flex; align-items: center; gap: 10px }
.gpstxt { min-width: 0; flex: 1 }
.gps b { display: block; font-size: 14px } .gps small { color: var(--muted) }
.dot { width: 12px; height: 12px; border-radius: 50%; background: var(--muted); flex: none }
.dot.on { background: #34d27b; box-shadow: 0 0 0 4px rgba(52,210,123,.25) }
.gpsrow button { border: 0; background: var(--bg2); border-radius: 10px; padding: 6px 10px; font-size: 12px; font-weight: 700; flex: none }
.search { position: relative }
.search input { width: 100%; border: 2px solid var(--line); border-radius: 12px; padding: 9px 12px; font: inherit; font-size: 14px; background: var(--bg); color: var(--ink) }
.qres { list-style: none; margin: 4px 0 0; padding: 4px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); display: grid; gap: 2px }
.qres button { width: 100%; text-align: left; border: 0; background: transparent; border-radius: 8px; padding: 8px 10px; font-size: 13px }
.qres button:hover, .qres button:focus-visible { background: var(--bg2) }
main { padding: 16px max(16px, env(safe-area-inset-right, 0px)) calc(28px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; max-width: 640px; margin: 0 auto }
body.running main { display: none }
.h { font-family: var(--f-display); text-transform: uppercase; letter-spacing: .06em; font-weight: 700; font-size: 15px; color: var(--muted); display: flex; justify-content: space-between; align-items: center; gap: 8px }
.sec { display: grid; gap: 10px }
.tip { margin: 0; padding: 12px 14px; border-radius: 14px; background: var(--card); border: 1px solid var(--line); font-size: 14px }
.linkbtn { border: 0; background: none; color: var(--accent); font-weight: 700; padding: 0 0 0 4px; font-size: 14px }
.chips { display: flex; gap: 6px; flex-wrap: wrap }
.chip { border: 0; background: var(--bg2); border-radius: 999px; padding: 7px 12px; font-size: 13px; font-weight: 600 }
.chip:hover { background: var(--sun); color: #14213d }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg) }
.kmbox { display: flex; align-items: center; gap: 8px; background: var(--card); border: 2px solid var(--line); border-radius: 18px; padding: 6px 8px 6px 16px }
.kmbox:focus-within { border-color: var(--accent) }
.kmbox input { flex: 1; min-width: 0; width: 100%; border: 0; background: transparent; color: var(--ink); font-family: var(--f-display); font-weight: 800; font-size: 44px; padding: 0 }
.kmbox input:focus { outline: none } .kmbox small { font-family: var(--f-display); font-weight: 700; font-size: 22px; color: var(--muted) }
.step { width: 40px; height: 40px; border-radius: 12px; border: 0; background: var(--bg2); font-size: 22px; font-weight: 700 }
.trow { display: grid; grid-template-columns: 12px minmax(0,1fr) auto; align-items: center; gap: 10px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 10px 12px }
.trow .sw { width: 12px; height: 36px; border-radius: 6px; background: var(--c) }
.trow b { display: block } .trow small { font-size: 11px; color: var(--muted) }
.tctl { display: flex; gap: 4px; align-items: center }
.tctl button { width: 32px; height: 32px; border: 0; border-radius: 9px; background: var(--bg2); font-weight: 700; font-size: 18px }
.tctl input { width: 56px; text-align: center; border: 2px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); font-family: var(--f-data); font-size: 15px; padding: 5px 2px }
.mix { display: flex; height: 12px; border-radius: 999px; overflow: hidden; background: var(--line) } .mix i { display: block }
.total { font-family: var(--f-data); font-size: 12px; padding: 3px 9px; border-radius: 999px; color: #fff; background: var(--bad); letter-spacing: 0 } .total.ok { background: var(--ok) }
.hint { margin: 0; font-size: 12px; font-weight: 600; color: var(--bad) } .hint.ok { color: var(--ok) }
.seg2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 4px }
.seg2 button { border: 0; border-radius: 10px; padding: 10px; background: transparent; font-weight: 700; font-size: 14px }
.seg2 button[aria-pressed="true"] { background: var(--ink); color: var(--bg) }
.note { margin: 0; font-size: 12px; color: var(--muted) }
.cta { border: 0; border-radius: 18px; padding: 16px; font-family: var(--f-display); font-weight: 800; font-size: 22px; text-transform: uppercase; letter-spacing: .04em; color: #14213d; background: linear-gradient(90deg, var(--sun), #ff9b3d) }
.cta:disabled { opacity: .45; cursor: not-allowed }
.ghost { border: 2px solid var(--line); background: var(--card); border-radius: 12px; padding: 10px 12px; font-weight: 700; font-size: 14px }
.msg { margin: 0; padding: 12px 14px; border-radius: 14px; background: var(--card); border: 1px solid var(--line); font-size: 14px }
.msg.err { border-color: var(--bad); color: var(--bad) }
.warn { margin: 0; padding: 10px 12px; border-radius: 12px; background: color-mix(in srgb, var(--sun) 22%, var(--card)); border: 1px solid var(--sun); font-size: 13px }
.opts { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 8px }
.opt { border: 2px solid var(--line); background: var(--card); border-radius: 14px; padding: 8px; text-align: left; display: grid }
.opt[aria-pressed="true"] { border-color: var(--accent) }
.opt small { font-size: 11px; color: var(--muted) } .opt b { font-family: var(--f-display); font-size: 22px; line-height: 1.05 }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 8px }
.stat { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 10px; min-width: 0 }
.stat span { display: block; font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted) }
.stat b { font-family: var(--f-display); font-size: 24px; font-weight: 800; font-variant-numeric: tabular-nums }
.actions { display: grid; gap: 8px }
.act3 { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 8px }
.crow { display: grid; grid-template-columns: 74px minmax(0,1fr) 92px; gap: 8px; align-items: center; font-size: 13px }
.bar { height: 10px; border-radius: 999px; background: var(--line); position: relative; overflow: hidden } .bar i { position: absolute; inset: 0 auto 0 0; background: var(--c); border-radius: 999px }
.crow code { font-family: var(--f-data); font-size: 11px; text-align: right; color: var(--muted) }
#profile svg { width: 100%; height: auto; display: block; touch-action: pan-y }
.proflabel { margin: 0; min-height: 18px; font-family: var(--f-data); font-size: 12px; color: var(--muted) }
.run { position: fixed; left: 0; right: 0; bottom: 0; z-index: 950; background: var(--app); color: #fff; border-radius: 22px 22px 0 0; padding: 14px max(16px, env(safe-area-inset-right, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 10px; box-shadow: 0 -10px 30px rgba(10,16,34,.35) }
.offroute { margin: 0; padding: 8px 10px; border-radius: 10px; background: var(--bad); font-weight: 700; font-size: 14px }
.runcue { font-size: 15px; font-weight: 600 }
.runcue b { color: var(--sun) }
.runstats { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 6px }
.runstats div { min-width: 0 }
.runstats span { display: block; font-size: 10px; text-transform: uppercase; letter-spacing: .08em; opacity: .75 }
.runstats b { font-family: var(--f-display); font-size: 26px; font-weight: 800; line-height: 1.1; font-variant-numeric: tabular-nums }
.runbar { height: 8px; border-radius: 999px; background: rgba(255,255,255,.15); overflow: hidden }
.runbar i { display: block; height: 100%; width: 0; background: var(--sun) }
.runbtns { display: grid; grid-template-columns: 1fr 1fr 1.4fr; gap: 8px }
.run .ghost { background: transparent; color: #fff; border-color: rgba(255,255,255,.3) }
.run .cta { padding: 12px; font-size: 18px }
dialog { border: 0; border-radius: 20px; padding: 20px; width: min(460px, calc(100vw - 32px)); max-height: 85vh; overflow-y: auto; background: var(--card); color: var(--ink) }
dialog::backdrop { background: rgba(10,16,34,.55) }
dialog h2 { margin: 0 0 10px; font-family: var(--f-display); text-transform: uppercase }
dialog label { display: block; font-size: 13px; font-weight: 600; margin: 12px 0 4px }
dialog input[type=text], dialog select { width: 100%; border: 2px solid var(--line); border-radius: 12px; padding: 10px; font-family: var(--f-body); font-size: 14px; background: var(--bg); color: var(--ink) }
dialog .check { display: flex; gap: 8px; align-items: center; font-weight: 600 }
.row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px }
.list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px }
.list li { display: grid; grid-template-columns: minmax(0,1fr) auto auto; gap: 6px; align-items: center; border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px }
.list li b { display: block; font-size: 14px } .list li small { color: var(--muted); font-size: 12px }
.list li button { border: 0; background: var(--bg2); border-radius: 9px; padding: 6px 10px; font-size: 12px; font-weight: 700 }
.empty { color: var(--muted); font-size: 13px; margin: 0 }
.sum { display: grid; grid-template-columns: 1fr 1fr; gap: 8px }
.kmmark { width: 22px; height: 22px; border-radius: 50%; background: #fff; color: #14213d; border: 2px solid #14213d; font: 700 11px/18px var(--f-body); text-align: center }
.seg3 { grid-template-columns: repeat(3, minmax(0,1fr)) }
.seg3 button { padding: 10px 4px; font-size: 13px }
.sights { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px }
.sights li { display: grid; grid-template-columns: 56px minmax(0,1fr); gap: 10px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 8px; align-items: start }
.sights img, .sights .ph { width: 56px; height: 56px; border-radius: 10px; object-fit: cover; background: var(--bg2); display: block }
.sights b { display: block; font-size: 14px } .sights small { display: block; font-size: 12px; color: var(--muted) }
.sights a { font-size: 12px; color: var(--accent); font-weight: 700 }
.sightmark { width: 24px; height: 24px; border-radius: 50%; background: var(--accent); color: #fff; border: 2px solid #fff; font: 700 12px/20px var(--f-body); text-align: center; box-shadow: 0 2px 6px rgba(0,0,0,.3) }
.modes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px }
.mcard { border: 2px solid var(--line); background: var(--card); border-radius: 18px; padding: 14px 12px; text-align: left; display: grid; gap: 4px; align-content: start; transition: transform .15s, border-color .15s, box-shadow .15s }
.mcard svg { width: 34px; height: 34px }
.mcard b { font-family: var(--f-display); font-size: 21px; text-transform: uppercase; line-height: 1.05 }
.mcard small { font-size: 12px; color: var(--muted); line-height: 1.35 }
.mcard[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 10px 24px -12px rgba(255,90,54,.7); transform: translateY(-2px); background: linear-gradient(160deg, color-mix(in srgb, var(--sun) 20%, var(--card)), var(--card)) }
.mcard[data-m="train"][aria-pressed="true"] { border-color: var(--ondulado); box-shadow: 0 10px 24px -12px rgba(47,140,255,.7); background: linear-gradient(160deg, color-mix(in srgb, var(--ondulado) 16%, var(--card)), var(--card)) }
.qtoggle { display: flex; gap: 10px; align-items: center; font-weight: 600; font-size: 14px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px }
.qtoggle input { width: 20px; height: 20px; accent-color: var(--ondulado) }
.challenge { margin: 0; padding: 12px 14px; border-radius: 14px; background: linear-gradient(90deg, #6c3bff, #ff5a36); color: #fff; font-size: 14px }
.turn { padding: 10px 12px; border-radius: 12px; background: #fff; color: #14213d; font-weight: 800; font-size: 17px; line-height: 1.25 }
.ghostbar { padding: 8px 10px; border-radius: 10px; font-weight: 700; font-size: 14px }
.ghostbar.ahead { background: rgba(52,210,123,.25); color: #8ff0b8 } .ghostbar.behind { background: rgba(232,69,139,.25); color: #ffb0d2 }
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px }
.badge { border: 1px solid var(--line); border-radius: 14px; padding: 10px; display: grid; gap: 2px; opacity: .45; filter: grayscale(1) }
.badge.on { opacity: 1; filter: none; border-color: var(--sun) }
.badge i { font-style: normal; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: linear-gradient(135deg, var(--sun), var(--accent)); color: #14213d; font: 800 15px var(--f-display) }
.badge b { font-size: 13px } .badge small { font-size: 11px; color: var(--muted) }
.newbadge { margin: 8px 0 0; padding: 10px 12px; border-radius: 12px; background: linear-gradient(90deg, var(--sun), #ff9b3d); color: #14213d; font-weight: 800 }
.row.wrap { flex-wrap: wrap }
[hidden] { display: none !important }
.errbox { overflow-wrap: anywhere; margin: 0; padding: 10px 14px; background: var(--bad); color: #fff; font-size: 13px }
</style>
<script>
function showErr(msg) {
  if (!document.body) { document.addEventListener("DOMContentLoaded", function () { showErr(msg); }); return; }
  var b = document.getElementById("errbox");
  if (!b) { b = document.createElement("p"); b.id = "errbox"; b.className = "errbox"; document.body.prepend(b); }
  b.textContent = "Error: " + msg;
}
window.addEventListener("error", function (e) {
  if (e.target && e.target.tagName && e.target.tagName !== "SCRIPT") return;
  showErr(e.message || (e.target && (e.target.src || e.target.href)) || "desconocido");
}, true);
</script>
</head>
<body>
<header class="top">
  <h1>Ruta a <span>Medida</span></h1>
  <div class="topbtns"><button class="icon-btn" id="openSaved" type="button" data-t="myRoutes"></button><button class="icon-btn" id="openCfg" type="button" data-t="settings"></button></div>
</header>
<p class="banner" id="offline" hidden data-t="offline"></p>
<div id="map"><p id="noMap" style="margin:0;padding:24px 20px;font-size:15px;line-height:1.5;color:var(--ink)"><b>El mapa no cargó / The map did not load.</b><br>Revisa tu conexión a internet. / Check your internet connection.</p></div>
<div class="gps">
  <div class="gpsrow">
    <span class="dot" id="gpsDot"></span>
    <span class="gpstxt"><b id="gpsTitle" data-t="gpsFinding"></b><small id="gpsSub" data-t="gpsAllow"></small></span>
    <button type="button" id="locate" data-t="myLocation"></button>
  </div>
  <div class="search">
    <input id="q" type="search" autocomplete="off" data-tp="searchPh" data-ta="searchPh">
    <ul class="qres" id="qres" hidden></ul>
  </div>
</div>

<main id="plan">
  <p class="tip" id="tip" hidden><span data-t="tip"></span> <button type="button" class="linkbtn" id="tipClose" data-t="gotIt"></button></p>
  <p class="challenge" id="challengeBox" hidden></p>

  <section class="sec">
    <div class="h"><span data-t="howTitle"></span></div>
    <div class="modes" id="mode">
      <button type="button" class="mcard" data-m="sights" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="#ff5a36" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s7-6.2 7-12a7 7 0 0 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg><b data-t="mSights"></b><small data-t="mSightsSub"></small></button>
      <button type="button" class="mcard" data-m="train" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="#2f8cff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6M12 2v3"/></svg><b data-t="mTrain"></b><small data-t="mTrainSub"></small></button>
    </div>
    <label class="qtoggle" id="quietWrap" hidden><input type="checkbox" id="quietChk"> <span data-t="quietLbl"></span></label>
    <p class="note" id="modeNote"></p>
  </section>

  <section class="sec">
    <div class="h"><span data-t="sportTitle"></span></div>
    <div class="seg2" id="sport"><button type="button" data-s="run" aria-pressed="true" data-t="run"></button><button type="button" data-s="bike" aria-pressed="false" data-t="bike"></button></div>
    <div class="chips" id="bikeType" hidden><button type="button" class="chip" data-b="cycling-regular" data-t="bikeCity"></button><button type="button" class="chip" data-b="cycling-road" data-t="bikeRoad"></button><button type="button" class="chip" data-b="cycling-mountain" data-t="bikeMtb"></button></div>
  </section>

  <section class="sec">
    <div class="h"><label for="km" data-t="kmTitle"></label></div>
    <div class="kmbox">
      <input id="km" type="number" inputmode="decimal" min="0.5" max="100" step="0.1" value="8">
      <small>km</small>
      <button type="button" class="step" data-dk="-0.5" data-ta="kmLess">−</button>
      <button type="button" class="step" data-dk="0.5" data-ta="kmMore">+</button>
    </div>
    <div class="chips" id="kmChips"></div>
  </section>

  <section class="sec">
    <div class="h"><span data-t="terrTitle"></span><span class="total" id="total">100%</span></div>
    <div class="chips">
      <button type="button" class="chip" data-p="100,0,0,0" data-t="pFlat"></button>
      <button type="button" class="chip" data-p="70,20,5,5" data-t="pEasy"></button>
      <button type="button" class="chip" data-p="40,40,10,10" data-t="pRolling"></button>
      <button type="button" class="chip" data-p="20,20,30,30" data-t="pHills"></button>
    </div>
    <div class="mix" id="mix"></div>
    <div class="sec" id="terr"></div>
    <p class="hint ok" id="hint"></p>
  </section>

  <button type="button" class="cta" id="go" data-t="go"></button>
  <p class="msg" id="msg" hidden></p>

  <section class="sec" id="result" hidden>
    <div class="h"><span data-t="chooseRoute"></span><button type="button" class="linkbtn" id="more" data-t="moreRoutes"></button></div>
    <div class="opts" id="opts"></div>
    <div class="stats" id="stats"></div>
    <p class="note" id="roads"></p>
    <div class="sec" id="sightsBox" hidden>
      <div class="h"><span data-t="sightsTitle"></span></div>
      <ul class="sights" id="sights"></ul>

// ================= Geometría =================
function haversine(a, b) {
  const R = 6371000, toR = Math.PI / 180, dLat = (b[1] - a[1]) * toR, dLng = (b[0] - a[0]) * toR;
  const x = Math.sin(dLat / 2) ** 2 + Math.cos(a[1] * toR) * Math.cos(b[1] * toR) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(x));
}
// Distancia (m) de un punto a un tramo a-b, y en qué parte del tramo cae (t de 0 a 1).
function project(p, a, b) {
  const k = Math.cos(a[1] * Math.PI / 180) * 111320, bx = (b[0] - a[0]) * k, by = (b[1] - a[1]) * 110540, px = (p[0] - a[0]) * k, py = (p[1] - a[1]) * 110540;
  const len2 = bx * bx + by * by, tt = len2 ? Math.max(0, Math.min(1, (px * bx + py * by) / len2)) : 0;
  return { d: Math.hypot(px - tt * bx, py - tt * by), t: tt };
}
// Convierte la línea de la ruta [lng, lat, elev] en tramos de 100 m clasificados por pendiente.
function analyze(coords) {
  const cum = [0];
  for (let i = 1; i < coords.length; i++) cum.push(cum[i - 1] + haversine(coords[i - 1], coords[i]));
  const total = cum[cum.length - 1] || 1;
  const at = d => {
    let i = cum.findIndex(c => c >= d);
    if (i <= 0) return { e: coords[0][2] || 0, ll: coords[0] };
    const f = (d - cum[i - 1]) / (cum[i] - cum[i - 1] || 1);
    return { e: (coords[i - 1][2] || 0) + f * ((coords[i][2] || 0) - (coords[i - 1][2] || 0)), ll: [coords[i - 1][0] + f * (coords[i][0] - coords[i - 1][0]), coords[i - 1][1] + f * (coords[i][1] - coords[i - 1][1])] };
  };
  const bins = [];
  for (let d = 0; d < total; d += BIN) {
    const d2 = Math.min(total, d + BIN), a = at(d), b = at(d2), g = (b.e - a.e) / (d2 - d || 1);
    const ty = g >= STEEP ? "subida" : g <= -STEEP ? "bajada" : Math.abs(g) < FLAT ? "plano" : "ondulado";
    bins.push({ from: d, to: d2, e0: a.e, e1: b.e, t: ty, a: a.ll, b: b.ll });
  }
  // Tramos seguidos del mismo tipo (para los avisos al correr).
  const segs = [];
  bins.forEach(b => { const l = segs[segs.length - 1]; if (l && l.t === b.t) l.to = b.to; else segs.push({ t: b.t, from: b.from, to: b.to }); });
  const real = { plano: 0, ondulado: 0, subida: 0, bajada: 0 };
  bins.forEach(b => real[b.t] += (b.to - b.from));
  TYPES.forEach(x => real[x.k] = Math.round(real[x.k] / total * 100));
  const diff = TYPES.reduce((a, x) => a + Math.abs(real[x.k] - S.mix[x.k]), 0);
  const kmErr = Math.abs(total / 1000 - S.km) / S.km * 100;
  return { total, cum, bins, segs, real, at, match: Math.max(0, Math.round(100 - diff / 2 - kmErr)) };
}
function routeFrom(coords, extra) {
  const r = Object.assign({ coords, ascent: 0, busy: 0, foot: 0, steps: [] }, extra || {}, analyze(coords));
  if (!r.ascent) { let up = 0; for (let i = 1; i < coords.length; i++) { const d = (coords[i][2] || 0) - (coords[i - 1][2] || 0); if (d > 0) up += d; } r.ascent = up; }
  r.rank = S.quiet ? r.match - r.busy : r.match;
  return r;
}
// Indicaciones giro a giro: dónde empieza cada una sobre la ruta. Sin "sigue derecho", salida ni llegadas.
function stepsOf(f, cum) {
  return ((f.properties.segments || []).flatMap(s => s.steps || [])).filter(s => [6, 10, 11].indexOf(s.type) < 0 && s.instruction)
    .map(s => ({ along: Math.round(cum[s.way_points[0]] || 0), text: s.instruction }));
}
function waysOf(f) {
  // Tipo de vía: 1-2 = carreteras y avenidas, 4-7 = senderos, ciclovías y banquetas peatonales.
  const w = { busy: 0, foot: 0 };
  ((f.properties.extras && f.properties.extras.waytype && f.properties.extras.waytype.summary) || []).forEach(x => { if (x.value === 1 || x.value === 2) w.busy += x.amount; if (x.value >= 4 && x.value <= 7) w.foot += x.amount; });
  return { busy: Math.round(w.busy), foot: Math.round(w.foot) };
}

// ================= Rutas reales (OpenRouteService) =================
const profile = () => bike() ? S.bikeType : "foot-walking";
async function orsRoute(body) {
  let res;
  try {
    res = await fetch(ORS + "/v2/directions/" + profile() + "/geojson", {
      method: "POST", headers: { "Content-Type": "application/json", "Authorization": getKey() },
      body: JSON.stringify(Object.assign({ elevation: true, extra_info: ["waytype"], instructions: true, language: LANG }, body))
    });
  } catch (e) { const err = new Error("red"); err.status = 0; throw err; }
  if (!res.ok) { const err = new Error("HTTP " + res.status); err.status = res.status; throw err; }
  return (await res.json()).features[0];
}
function routeFromFeature(f, extra) {
  const r = routeFrom(f.geometry.coordinates, Object.assign({ ascent: f.properties.ascent || 0 }, waysOf(f), extra));
  r.steps = stepsOf(f, r.cum);
  return r;
}
// Ruta de ida y vuelta (solo entrenar).
async function fetchLoop(seed, points, factor) {
  const opts = { round_trip: { length: Math.round(S.km * 1000 * factor), points, seed } };
  if (S.quiet && !bike()) { opts.avoid_features = ["steps"]; opts.profile_params = { weightings: { quiet: 1, green: 1 } }; }
  const f = await orsRoute({ coordinates: [[S.start.lng, S.start.lat]], options: opts });
  return routeFromFeature(f, { seed, points, factor });
}
function showMsg(text, isErr) { $("msg").hidden = !text; $("msg").innerHTML = text || ""; $("msg").classList.toggle("err", !!isErr); }
function errText(st) { return st === 0 ? t("errNet") : st === 401 || st === 403 ? t("errKey") : st === 429 ? t("errLimit") : t("errNone"); }
async function createRoutes() {
  if (!S.start) { showMsg(t("needStart"), true); return; }
  const b = S.seedBase;
  // El servicio suele dar rutas más largas de lo pedido, así que pedimos un poco menos.
  const tries = bike() ? [[b + 1, 4, .8], [b + 2, 5, .84], [b + 3, 4, .88], [b + 4, 5, .82], [b + 5, 4, .86], [b + 6, 5, .92]]
    : [[b + 1, 4, .72], [b + 2, 5, .76], [b + 3, 4, .8], [b + 4, 5, .72], [b + 5, 4, .76], [b + 6, 5, .84]];
  $("go").dataset.busy = "1"; $("go").textContent = t("busy"); renderSetup();
  let ok = [], note = "", results = [];
  if (S.routeMode === "sights") {
    try { ok = await createSightRoutes(); } catch (e) { ok = []; }
    if (!ok.length) note = t("noSightsFallback");
  }
  if (!ok.length) {
    showMsg(note + t("findingRoutes"));
    results = await Promise.allSettled(tries.map(([s, p, f]) => fetchLoop(s, p, f)));
    ok = results.filter(r => r.status === "fulfilled").map(r => r.value);
  }
  $("go").dataset.busy = ""; $("go").textContent = t("go"); renderSetup();
  if (!ok.length) { const st = results.length && results[0].reason ? results[0].reason.status : 0; showMsg(errText(st), true); return; }
  showMsg(note);
  S.challenge = null; $("challengeBox").hidden = true;
  S.routes = ok.sort((x, y) => y.rank - x.rank).slice(0, 3); S.opt = 0;
  showResult(true);
  await loadSightInfo();
  store.set("rm_last", packRoute(S.routes[0], t("lastRoute")));
}

// ================= Lugares para conocer (Wikipedia) =================
const SIGHT_TYPES = { landmark: 1, mountain: 1, waterbody: 1, forest: 1, glacier: 1, isle: 1, river: 1 };
const NOT_PLACES = ["distrito", "district", "batalla", "battle", "diócesis", "diocese", "electoral", "municipio", "municipality", "kansas city"];
const wapi = lang => "https://" + (lang || S.wlang) + ".wikipedia.org/w/api.php?format=json&origin=*&";
const shortTitle = x => String(x).split(" (")[0];
async function getJSON(url, ms) {
  const ctl = new AbortController(), tm = setTimeout(() => ctl.abort(), ms || 15000);
  try { const r = await fetch(url, { signal: ctl.signal }); if (!r.ok) throw new Error("HTTP " + r.status); return await r.json(); }
  finally { clearTimeout(tm); }
}
function rng(seed) { let s = Math.abs(Math.round(seed)) % 2147483646 + 1; return () => (s = s * 16807 % 2147483647) / 2147483647; }
// Lugares con artículo de Wikipedia cerca de la salida. Los artículos más largos suelen ser los lugares más conocidos.
async function findSights(lat, lng, radius, lang) {
  const g = await getJSON(wapi(lang) + "action=query&list=geosearch&gscoord=" + lat.toFixed(5) + "%7C" + lng.toFixed(5) + "&gsradius=" + Math.round(Math.min(10000, Math.max(1000, radius))) + "&gslimit=100&gsprop=type");
  // Solo lugares que se pueden visitar: sin batallas, distritos, diócesis ni estaciones de radio y TV.
  let items = ((g.query && g.query.geosearch) || []).filter(i => (i.type ? SIGHT_TYPES[i.type] : lang === "en") && !NOT_PLACES.some(w => i.title.toLowerCase().indexOf(w) >= 0) && !/^X[EH][A-Z]/.test(i.title)).slice(0, 50);
  if (!items.length) return [];
  const info = await getJSON(wapi(lang) + "action=query&prop=info&pageids=" + items.map(i => i.pageid).join("%7C"));
  const len = {}; Object.values((info.query && info.query.pages) || {}).forEach(p => len[p.pageid] = p.length || 0);
  items = items.map(i => ({ id: i.pageid, title: i.title, lat: i.lat, lon: i.lon, score: Math.log10(1000 + (len[i.pageid] || 0)) + (i.type === "landmark" ? .3 : 0) })).sort((a, b) => b.score - a.score);
  const out = [];
  // Sin lugares pegados a la salida (ya estás ahí) ni repetidos a menos de 120 m.
  items.forEach(i => { if (haversine([lng, lat], [i.lon, i.lat]) > 250 && !out.some(o => haversine([o.lon, o.lat], [i.lon, i.lat]) < 120)) out.push(i); });
  return out.slice(0, 20);
}
// Elige grupos de 1 a 4 lugares que, unidos en una vuelta, den más o menos la distancia pedida.
function pickLoops(sights, L, factor, avoid) {
  const st = S.start, s0 = [st.lng, st.lat], target = L / factor, rnd = rng(7 + L + S.seedBase * 31);
  const ang = s => Math.atan2(s.lat - st.lat, (s.lon - st.lng) * Math.cos(st.lat * Math.PI / 180));
  const perim = set => { let p = 0, prev = s0; set.forEach(s => { const c = [s.lon, s.lat]; p += haversine(prev, c); prev = c; }); return p + haversine(prev, s0); };
  const n = sights.length, seen = {}, cands = [];
  for (let k0 = 0; k0 < 600 && n; k0++) {
    const k = 1 + Math.floor(rnd() * Math.min(4, n)), set = [];
    while (set.length < k) { const s = sights[Math.floor(rnd() * n)]; if (set.indexOf(s) < 0) set.push(s); }
    // En orden alrededor de la salida, para que la vuelta no se cruce.
    set.sort((a, b) => ang(a) - ang(b));
    const key = set.map(s => s.id).sort().join(",");
    if (seen[key] || avoid[key]) continue;
    seen[key] = 1;
    const p = perim(set), err = Math.abs(p - target) / target;
    if (err <= .2) cands.push({ set, key, perim: p, score: set.reduce((a, s) => a + s.score, 0) - err * 10 });
  }
  cands.sort((a, b) => b.score - a.score);
  const picked = [];
  cands.forEach(c => { if (picked.length < 3 && !picked.some(p => c.set.filter(s => p.set.indexOf(s) >= 0).length * 2 > Math.min(c.set.length, p.set.length))) picked.push(c); });
  return picked;
}
function placeSights(r, set) {
  return set.map(s => {
    let best = 1e9, along = 0;
    for (let i = 0; i < r.coords.length - 1; i++) { const pr = project([s.lon, s.lat], r.coords[i], r.coords[i + 1]); if (pr.d < best) { best = pr.d; along = r.cum[i] + pr.t * (r.cum[i + 1] - r.cum[i]); } }
    return { id: s.id, title: s.title, lat: s.lat, lon: s.lon, along: Math.round(along) };
  }).sort((a, b) => a.along - b.along);
}
async function fetchVia(pick) {
  const s0 = [S.start.lng, S.start.lat];
  const f = await orsRoute({ coordinates: [s0].concat(pick.set.map(s => [s.lon, s.lat]), [s0]) });
  const r = routeFromFeature(f, { straight: pick.perim });
  r.sights = placeSights(r, pick.set);
  r.rank = r.match + 6 * r.sights.length;

}
async function createSightRoutes() {
  showMsg(t("findingPlaces"));
  const L = S.km * 1000, other = LANG === "es" ? "en" : "es";
  // Primero en el idioma del teléfono; si hay pocos lugares, también en el otro idioma.
  let sights = await findSights(S.start.lat, S.start.lng, L * .45, LANG); S.wlang = LANG;
  if (sights.length < 4) { const o = await findSights(S.start.lat, S.start.lng, L * .45, other).catch(() => []); if (o.length > sights.length) { sights = o; S.wlang = other; } }
  if (!sights.length) return [];
  showMsg(t("buildingVia", esc(shortTitle(sights[0].title))));
  let factor = bike() ? 1.25 : 1.3, out = [];
  const avoid = {};
  for (let round = 0; round < 2; round++) {
    const picks = pickLoops(sights, L, factor, avoid);
    if (!picks.length) break;
    picks.forEach(p => avoid[p.key] = 1);
    const rs = (await Promise.allSettled(picks.map(fetchVia))).filter(x => x.status === "fulfilled").map(x => x.value);
    out = out.concat(rs);
    if (!rs.length || Math.min(...out.map(x => Math.abs(x.total - L) / L)) < .08) break;
    // Ajusta con lo que de verdad midieron las calles y vuelve a intentar.
    factor = rs.reduce((a, x) => a + x.total / x.straight, 0) / rs.length;
  }
  // Solo deja rutas cuya distancia quede cerca de lo pedido.
  return out.filter(x => Math.abs(x.total - L) / L < .25);
}

function profileSVG(rt) {
  const W = 600, H = 170, pad = { l: 40, r: 8, t: 10, b: 22 };
  const es = rt.bins.flatMap(b => [b.e0, b.e1]); let lo = Math.min(...es), hi = Math.max(...es);
  const span = Math.max(hi - lo, 15); lo -= span * .15; hi = lo + span * 1.3;
  const km = rt.total / 1000;
  const x = d => pad.l + d / rt.total * (W - pad.l - pad.r), y = e => pad.t + (1 - (e - lo) / (hi - lo)) * (H - pad.t - pad.b);
  let s = "";
  const eStep = [5, 10, 20, 50, 100, 200, 500].find(v => span * 1.3 / v <= 4) || 1000;
  for (let v = Math.ceil(lo / eStep) * eStep; v <= hi; v += eStep) s += '<line x1="' + pad.l + '" x2="' + (W - pad.r) + '" y1="' + y(v) + '" y2="' + y(v) + '" stroke="var(--line)"/><text x="' + (pad.l - 5) + '" y="' + (y(v) + 4) + '" font-size="11" text-anchor="end" fill="var(--muted)" font-family="var(--f-data)">' + Math.round(v) + 'm</text>';
  const kStep = [1, 2, 5, 10, 20, 50].find(v => km / v <= 8) || 100;
  for (let k = 0; k <= km + 1e-6; k += kStep) s += '<text x="' + x(k * 1000) + '" y="' + (H - 6) + '" font-size="11" text-anchor="middle" fill="var(--muted)" font-family="var(--f-data)">' + k + ' km</text>';
  rt.bins.forEach(b => s += '<path d="M' + x(b.from) + ',' + y(lo) + ' L' + x(b.from) + ',' + y(b.e0) + ' L' + x(b.to) + ',' + y(b.e1) + ' L' + x(b.to) + ',' + y(lo) + ' Z" fill="var(--' + b.t + ')" opacity=".85"/>');
  s += '<line id="pcur" x1="0" x2="0" y1="' + pad.t + '" y2="' + (H - pad.b) + '" stroke="var(--ink)" stroke-width="2" visibility="hidden"/>';
  return '<svg id="psvg" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + t("profileTitle") + '" data-l="' + pad.l + '" data-w="' + (W - pad.l - pad.r) + '">' + s + '</svg>';
}
function profilePoint(e) {
  const svg = $("psvg"); if (!svg || !S.routes.length) return;
  const rt = S.routes[S.opt], box = svg.getBoundingClientRect();
  const vx = (e.clientX - box.left) / box.width * 600, l = +svg.dataset.l, w = +svg.dataset.w;
  const d = Math.min(rt.total, Math.max(0, (vx - l) / w * rt.total));
  const p = rt.at(d), bin = rt.bins[Math.min(rt.bins.length - 1, Math.floor(d / BIN))];
  const cur = $("pcur"); cur.setAttribute("x1", l + d / rt.total * w); cur.setAttribute("x2", l + d / rt.total * w); cur.setAttribute("visibility", "visible");
  if (!cursor) cursor = L.circleMarker([p.ll[1], p.ll[0]], { radius: 8, color: "#fff", weight: 3, fillColor: C("accent"), fillOpacity: 1 }).addTo(map); else cursor.setLatLng([p.ll[1], p.ll[0]]);

}

const BADGES = [["first", "1"], ["5k", "5K"], ["10k", "10K"], ["21k", "21K"], ["bike40", "40"], ["explorer", "10"], ["globe", "3"], ["streak", "3s"], ["hills", "200"], ["win", "1º"]];

function checkBadges(run) {
  const b = store.get("rm_badges", {}), runs = store.get("rm_runs", []), seen = store.get("rm_seen", []), newly = [];
  const give = k => { if (!b[k]) { b[k] = Date.now(); newly.push(k); } };
  if (run.completed) give("first");
  if (run.sport !== "bike" && run.dist >= 5000) give("5k");
  if (run.sport !== "bike" && run.dist >= 10000) give("10k");
  if (run.sport !== "bike" && run.dist >= 21097) give("21k");
  if (run.sport === "bike" && run.dist >= 40000) give("bike40");
  if (seen.length >= 10) give("explorer");
  const cities = []; runs.forEach(x => { if (x.start && !cities.some(c => haversine(c, x.start) < 30000)) cities.push(x.start); });
  if (cities.length >= 3) give("globe");
  const weeks = new Set(runs.map(x => weekNo(x.date))), w = weekNo(Date.now());
  if (weeks.has(w) && weeks.has(w - 1) && weeks.has(w - 2)) give("streak");
  if (run.climb >= 200) give("hills");
  if (run.won) give("win");
  store.set("rm_badges", b);
  return newly;
}

function runElapsed() { const r = S.run; return r.acc + (r.paused ? 0 : (Date.now() - r.t0) / 1000); }

$("start").addEventListener("click", () => {
  const rt = S.routes[S.opt];
  S.run = { rt, t0: Date.now(), acc: 0, paused: false, dist: 0, last: null, idx: 0, done: 0, off: false, cued: {}, kmSaid: 0, samples: [], sightSaid: {}, stepSaid: {}, ghostSaid: 0 };
  document.body.classList.add("running"); $("run").hidden = false;
  if (cursor) { cursor.remove(); cursor = null; }
  setTimeout(() => map.invalidateSize(), 50);
  S.follow = true; keepAwake();
  if (watchId === null) locate(false);
  say(t("vStart", metersText(rt.total)), "alert");
  tick = setInterval(renderRun, 1000); renderRun();
  if (S.here) onRunPosition({ coords: { latitude: S.here.lat, longitude: S.here.lng, accuracy: S.here.acc }, timestamp: Date.now() });
});
map.on("dragstart", () => { if (S.run) S.follow = false; });
$("center").addEventListener("click", () => { S.follow = true; if (S.here) map.setView([S.here.lat, S.here.lng], Math.max(map.getZoom(), 16)); });
$("pause").addEventListener("click", () => {
  const r = S.run; if (!r) return;
  if (r.paused) { r.paused = false; r.t0 = Date.now(); r.last = null; r.lastT = 0; $("pause").textContent = t("pause"); keepAwake(); say(t("vResume"), "alert"); }
  else { r.acc = runElapsed(); r.paused = true; $("pause").textContent = t("resume"); say(t("vPause"), "alert"); }
  renderRun();
});
$("finish").addEventListener("click", () => endRun(false));

// Reto: dónde iría tu amigo en este momento, a su ritmo promedio.
function ghostGap(r) { const c = S.challenge; if (!c) return null; const g = Math.min(r.rt.total, runElapsed() / c.time * r.rt.total); return r.done - g; }

function onRunPosition(p) {
  const r = S.run; if (!r || r.paused) return;
  const acc = p.coords.accuracy || 30, here = [p.coords.longitude, p.coords.latitude];
  if (S.follow) map.panTo([here[1], here[0]], { animate: true });
  if (acc > 60) return;
  // Distancia con GPS (solo se usa fuera de la ruta). Si el GPS salta lejos (túnel, sin señal), cuenta solo si la velocidad es posible.
  const now = runElapsed();
  let gpsStep = 0;
  if (r.last) { const step = haversine(r.last, here), dt = Math.max(1, now - r.lastT); if (step >= 4) { if (step < 200 || step / dt < (bike() ? 25 : 8)) gpsStep = step; r.last = here; r.lastT = now; } }
  else { r.last = here; r.lastT = now; }
  // Avance sobre la ruta: mide contra cada tramo de la línea, solo un poco hacia adelante (la salida y la meta están en el mismo lugar).
  const rt = r.rt, n = rt.coords.length;
  let best = -1, bestD = 1e9, bestAlong = 0;
  const ahead = Math.max(r.done, r.dist) + (bike() ? 900 : 300);
  for (let i = Math.max(0, r.idx - 5); i < n - 1 && rt.cum[i] <= ahead; i++) { const pr = project(here, rt.coords[i], rt.coords[i + 1]); if (pr.d < bestD) { bestD = pr.d; best = i; bestAlong = rt.cum[i] + pr.t * (rt.cum[i + 1] - rt.cum[i]); } }
  const offNow = bestD > (bike() ? 60 : 45) + acc / 2;
  if (offNow && !r.off) say(t("vOff"), "alert");
  r.off = offNow; $("offroute").hidden = !offNow;
  // Sobre la ruta, lo recorrido se mide sobre la línea (sin el ruido del GPS). Fuera de ella, con el GPS.
  if (!offNow && best >= 0 && bestAlong >= r.done - 50) { const prev = r.done; r.idx = best; r.done = Math.max(r.done, bestAlong); r.dist += Math.min(r.done - prev, bike() ? 900 : 300); }
  else if (offNow) r.dist += gpsStep;
  r.samples.push({ t: now, d: r.dist }); if (r.samples.length > 60) r.samples.shift();
  // Guía completa: el siguiente giro, un poco antes de llegar.
  const st = (rt.steps || []).find(s => s.along > r.done - 10 && !r.stepSaid[s.along]);
  if (st && st.along - r.done <= (bike() ? 90 : 45)) { r.stepSaid[st.along] = 1; say(st.along - r.done > 15 ? t("vTurn", metersText(st.along - r.done), lowerFirst(st.text)) : st.text, "turn"); }
  // Kilómetros (cada 5 km en bici).
  const every = bike() ? 5 : 1, k = Math.floor(r.dist / 1000 / every) * every;
  if (k > r.kmSaid) {
    r.kmSaid = k; const spk = runElapsed() / (r.dist / 1000), pc = fmtPace(spk).split(":");
    say(bike() ? t("vKmBike", k, Math.round(3600 / spk)) : t("vKm", k, t("paceSpeech", pc[0], pc[1])), "alert");
    const gap = ghostGap(r);
    if (gap !== null && Math.abs(gap) >= 10) say(t(gap > 0 ? "vGhost" : "vGhostB", metersText(Math.abs(gap)), S.challenge.name), "alert");
  }
  // Subidas y bajadas (lo ondulado es suave y llenaría de avisos).
  const nxt = rt.segs.find(s => s.from > r.done && s.to - s.from >= 80 && (s.t === "subida" || s.t === "bajada"));
  if (nxt && nxt.from - r.done <= (bike() ? 400 : 200) && !r.cued[nxt.from]) { r.cued[nxt.from] = 1; say(t("vHill", metersText(nxt.from - r.done), NAMES[nxt.t], metersText(nxt.to - nxt.from)), "alert"); }
  // Lugares: avisa poco antes de llegar y cuenta un poco de cada uno.
  if (rt.sights) {
    const sg = rt.sights.find(s => s.along > r.done - 20 && !r.sightSaid[s.id]);
    if (sg && sg.along - r.done <= (bike() ? 300 : 150)) { r.sightSaid[sg.id] = 1; const inf = S.sightInfo[sg.id]; say((sg.along - r.done > 40 ? t("vPlaceIn", metersText(sg.along - r.done), shortTitle(sg.title)) : t("vPlaceNow", shortTitle(sg.title))) + (inf && inf.extract ? " " + firstSentence(inf.extract) : ""), "alert"); }
  }
  if (r.done >= rt.total - 40 && r.dist >= rt.total * .8) endRun(true);
  renderRun();
}
function renderRun() {
  const r = S.run; if (!r) return;
  const rt = r.rt, tt = runElapsed();
  $("rDone").textContent = (r.dist / 1000).toFixed(2);
  $("rLeft").textContent = (Math.max(0, rt.total - r.done) / 1000).toFixed(2);
  $("rTime").textContent = fmtClock(tt);
  const a = r.samples.find(s => s.t >= tt - 60), cur = a && r.dist - a.d > 30 ? (tt - a.t) / ((r.dist - a.d) / 1000) : tt / (r.dist / 1000);
  $("rPaceL").textContent = bike() ? "km/h" : t("pace");
  $("rPace").textContent = r.dist > 50 ? (bike() ? (3600 / cur).toFixed(1) : fmtPace(cur)) : "--";
  $("rBar").style.width = Math.min(100, r.done / rt.total * 100) + "%";
  const st = !r.paused && (rt.steps || []).find(s => s.along > r.done - 10);
  $("turn").hidden = !(st && S.voiceMode === "full" && (r.done || r.dist));
  if (st) $("turn").textContent = t("turnIn", st.text, Math.max(0, Math.round(st.along - r.done)));
  const curSeg = rt.segs.find(s => s.from <= r.done && s.to > r.done) || rt.segs[0];
  const nxt = rt.segs.find(s => s.from > r.done && s.to - s.from >= 80 && (s.t === "subida" || s.t === "bajada"));
  let cue = r.paused ? t("cuePaused") : !r.done && !r.dist ? t("cueStart") : t("cueNow", NAMES[curSeg.t]);
  if (!r.paused && (r.done || r.dist)) cue += nxt ? t("cueNext", NAMES[nxt.t], Math.round((nxt.to - nxt.from) / 50) * 50, fmtKm(nxt.from - r.done)) : t("cueNoHills");
  const ns = !r.paused && rt.sights ? rt.sights.find(s => s.along > r.done - 20) : null;
  if (ns) cue += t("cuePlace", esc(shortTitle(ns.title)), fmtKm(Math.max(0, ns.along - r.done)));
  $("cue").innerHTML = cue;
  const gap = ghostGap(r);
  $("ghost").hidden = gap === null;
  if (gap !== null) { $("ghost").className = "ghostbar " + (gap >= 0 ? "ahead" : "behind"); $("ghost").textContent = Math.abs(gap) < 10 ? t("ghostEven", S.challenge.name) : t(gap > 0 ? "ghostAhead" : "ghostBehind", Math.round(Math.abs(gap)), S.challenge.name); }
}
function endRun(completed) {
  const r = S.run; if (!r) return;
  const tt = runElapsed(); clearInterval(tick); S.run = null;
  try { if (wake) wake.release(); } catch (e) {} wake = null;
  document.body.classList.remove("running"); $("run").hidden = true; $("offroute").hidden = true; $("pause").textContent = t("pause");
  setTimeout(() => map.invalidateSize(), 50);
  const rt = r.rt, frac = Math.min(1, r.done / rt.total);
  // Lugares por los que de verdad pasaste.
  const passed = (rt.sights || []).filter(s => s.along <= r.done + 30);
  const seen = store.get("rm_seen", []); passed.forEach(s => { const key = S.wlang + ":" + s.id; if (seen.indexOf(key) < 0) seen.push(key); }); store.set("rm_seen", seen);
  const c = S.challenge, won = !!(c && completed && tt < c.time);
  const run = { date: new Date().toISOString(), dist: r.dist, time: tt, planned: rt.total, sport: S.sport, completed: completed || frac >= .9, climb: Math.round(rt.ascent * frac), places: passed.length, won, start: [S.start.lng, S.start.lat] };
  if (r.dist > 100) { const runs = store.get("rm_runs", []); runs.unshift(run); store.set("rm_runs", runs.slice(0, 50)); }
  const newly = r.dist > 100 ? checkBadges(run) : [];
  say(t(completed ? "vDone" : "vEnd"), "alert");
  S.lastRun = { run, rt, passed };
  $("sumGhost").hidden = !(c && completed);
  if (c && completed) $("sumGhost").textContent = t(won ? "beat" : "lost", c.name, fmtClock(Math.abs(c.time - tt)));
  $("sumBody").innerHTML = [[t("distance"), fmtKm(r.dist) + " km"], [t("time"), fmtClock(tt)], (bike() ? [t("avgSpeed"), r.dist > 50 ? (r.dist / 1000 / (tt / 3600)).toFixed(1) + " km/h" : "--"] : [t("avgPace"), r.dist > 50 ? fmtPace(tt / (r.dist / 1000)) + " /km" : "--"]), passed.length ? [t("placesSeen"), passed.length] : [t("completed"), Math.round(frac * 100) + "%"]]
    .map(x => '<div class="stat"><span>' + x[0] + '</span><b>' + x[1] + '</b></div>').join("");
  $("sumBadges").innerHTML = newly.map(k => '<p class="newbadge">' + t("newBadge", t("b_" + k)) + '</p>').join("");
  $("sumChallenge").hidden = !(canLink(rt) && completed && r.dist > 100);
  $("summary").showModal();
}
$("sumClose").addEventListener("click", () => $("summary").close());
$("sumChallenge").addEventListener("click", () => {
  const L0 = S.lastRun; if (!L0) return;
  const name = S.name || t("aFriend");
  shareLink(shareUrl(L0.rt) + "&reto=" + encodeURIComponent(name) + "_" + Math.round(L0.run.time), t("challengeText", name, fmtKm(L0.rt.total), fmtClock(L0.run.time)));
});

// ================= Imagen para compartir =================
async function makeCard(L0) {
  const W = 1080, H = 1350, cv = document.createElement("canvas"); cv.width = W; cv.height = H;
  const g = cv.getContext("2d"), run = L0.run, rt = L0.rt;
  const bg = g.createLinearGradient(0, 0, W, H); bg.addColorStop(0, "#14213d"); bg.addColorStop(1, "#2a1846"); g.fillStyle = bg; g.fillRect(0, 0, W, H);
  g.fillStyle = "#ffffff"; g.font = "800 64px 'Barlow Condensed', 'Arial Narrow', sans-serif"; g.fillText("RUTA A ", 70, 120);
  g.fillStyle = "#ffc23c"; g.fillText("MEDIDA", 70 + g.measureText("RUTA A ").width, 120);
  g.fillStyle = "rgba(255,255,255,.7)"; g.font = "500 32px Archivo, system-ui, sans-serif"; g.fillText(dateFmt(run.date, { weekday: "long", day: "numeric", month: "long" }), 70, 172);
  // Ruta dibujada a escala.
  const xs = rt.coords.map(c => c[0]), ys = rt.coords.map(c => c[1]), k = Math.cos(ys[0] * Math.PI / 180);
  const minX = Math.min(...xs), maxX = Math.max(...xs), minY = Math.min(...ys), maxY = Math.max(...ys);
  const sc = Math.min(860 / ((maxX - minX) * k || 1e-6), 560 / ((maxY - minY) || 1e-6)), ox = 110 + (860 - (maxX - minX) * k * sc) / 2, oy = 230 + (560 - (maxY - minY) * sc) / 2;
  const px = c => [ox + (c[0] - minX) * k * sc, oy + (maxY - c[1]) * sc];
  g.lineCap = "round"; g.lineJoin = "round";
  g.strokeStyle = "rgba(0,0,0,.35)"; g.lineWidth = 26; g.beginPath(); rt.coords.forEach((c, i) => { const q = px(c); if (i) g.lineTo(q[0], q[1]); else g.moveTo(q[0], q[1]); }); g.stroke();
  g.lineWidth = 14; rt.bins.forEach(b => { g.strokeStyle = C(b.t); g.beginPath(); const a = px(b.a), z = px(b.b); g.moveTo(a[0], a[1]); g.lineTo(z[0], z[1]); g.stroke(); });
  const s0 = px(rt.coords[0]); g.fillStyle = "#34d27b"; g.beginPath(); g.arc(s0[0], s0[1], 18, 0, 7); g.fill();
  (rt.sights || []).forEach((s, i) => { const q = px([s.lon, s.lat]); g.fillStyle = "#ff5a36"; g.beginPath(); g.arc(q[0], q[1], 22, 0, 7); g.fill(); g.fillStyle = "#fff"; g.font = "700 26px Archivo, sans-serif"; g.textAlign = "center"; g.fillText(String(i + 1), q[0], q[1] + 9); g.textAlign = "left"; });
  // Datos.
  const bikeRun = run.sport === "bike", stats = [[t("cardRoute"), fmtKm(run.dist) + " km"], [t("cardTime"), fmtClock(run.time)], bikeRun ? [t("cardSpeed"), (run.dist / 1000 / (run.time / 3600)).toFixed(1) + " km/h"] : [t("cardPace"), fmtPace(run.time / (run.dist / 1000)) + " /km"]];
  stats.forEach((s, i) => { const x = 70 + i * 330; g.fillStyle = "rgba(255,255,255,.65)"; g.font = "600 28px Archivo, sans-serif"; g.fillText(s[0].toUpperCase(), x, 880); g.fillStyle = "#fff"; g.font = "800 84px 'Barlow Condensed', 'Arial Narrow', sans-serif"; g.fillText(s[1], x, 965); });
  if (L0.passed.length) {
    g.fillStyle = "#ffc23c"; g.font = "700 30px Archivo, sans-serif"; g.fillText(t("cardPlaces").toUpperCase(), 70, 1050);
    g.fillStyle = "#fff"; g.font = "500 34px Archivo, sans-serif";
    L0.passed.slice(0, 4).forEach((s, i) => g.fillText((i + 1) + ". " + shortTitle(s.title).slice(0, 44), 70, 1105 + i * 50));
  }
  g.fillStyle = "rgba(255,255,255,.55)"; g.font = "500 26px Archivo, sans-serif"; g.fillText(location.host + location.pathname, 70, H - 50);
  return new Promise(res => cv.toBlob(b => res(new File([b], "ruta-a-medida.png", { type: "image/png" })), "image/png"));
}
$("sumImage").addEventListener("click", async () => { if (S.lastRun) await shareFile(await makeCard(S.lastRun), "Ruta a Medida"); });

// ================= Rutas compartidas y retos por link =================
async function openSharedSights(main) {
  const parts = main.split("lugares=")[1].split("_");
  const lang = parts[0] === "en" ? "en" : "es", v = parts.slice(1).map(Number);
  if (v.length < 9 || v.some(x => !isFinite(x))) return false;
  S.wlang = lang;
  if (v[0] > 0) { S.bikeType = BIKE_TYPES[v[0] - 1] || BIKE_TYPES[0]; setSport("bike", true); } else setSport("run", true);
  S.km = v[1]; TYPES.forEach((x, i) => S.mix[x.k] = v[2 + i]); setMode("sights"); renderSetup();
  setStart(v[6], v[7], "shared", t("sharedPoint")); map.setView([v[6], v[7]], 14);
  showMsg(t("loadingShared"));
  try {
    const ids = v.slice(8);
    const j = await getJSON(wapi(lang) + "action=query&prop=coordinates&pageids=" + ids.join("%7C"));
    const pages = (j.query && j.query.pages) || {};
    const set = ids.map(id => pages[id]).filter(p => p && p.coordinates).map(p => ({ id: p.pageid, title: p.title, lat: p.coordinates[0].lat, lon: p.coordinates[0].lon }));
    S.routes = [await fetchVia({ set, perim: 1 })]; S.opt = 0;
    showMsg(S.challenge ? "" : t("sharedReady")); showResult(true); await loadSightInfo();
  } catch (e) { showMsg(errText(e.status || 0), true); }
  return true;
}
async function openShared() {
  const parts = location.hash.split("&reto="), main = parts[0];
  if (parts[1]) {
    const c = parts[1].split("_"), time = +c[c.length - 1], name = decodeURIComponent(c.slice(0, -1).join("_")).slice(0, 20);
    if (isFinite(time) && time > 0) S.challenge = { name: name || t("aFriend"), time };
  }
  const showChallenge = () => { if (S.challenge && S.routes.length) { $("challengeBox").hidden = false; $("challengeBox").innerHTML = t("challengeBox", esc(S.challenge.name), fmtKm(S.routes[0].total), fmtClock(S.challenge.time)); } };
  if (main.indexOf("lugares=") >= 0) { const ok = await openSharedSights(main); showChallenge(); return ok; }
  const m = main.split("ruta=")[1]; if (!m) return false;
  const v = m.split("_").map(Number); if (v.length < 11 || v.some(x => !isFinite(x))) return false;
  if (v[11] > 0) { S.bikeType = BIKE_TYPES[v[11] - 1] || BIKE_TYPES[0]; setSport("bike", true); } else setSport("run", true);
  S.km = v[2]; TYPES.forEach((x, i) => S.mix[x.k] = v[3 + i]); S.quiet = v[7] === 1; setMode("train"); renderSetup();
  setStart(v[0], v[1], "shared", t("sharedPoint"));
  map.setView([v[0], v[1]], 15);
  showMsg(t("loadingShared"));
  try { S.routes = [await fetchLoop(v[8], v[9], v[10])]; S.opt = 0; showMsg(S.challenge ? "" : t("sharedReady")); showResult(true); showChallenge(); }
  catch (e) { showMsg(errText(e.status), true); }
  return true;
}

window.addEventListener("online", net); window.addEventListener("offline", net); net();
